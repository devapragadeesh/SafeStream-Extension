<svg width="1180" height="760" viewBox="0 0 1180 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#d0d5dd; stroke-width:1.5; rx:12; }
      .title { font-size:15px; font-weight:700; fill:#101828; }
      .sub { font-size:12px; fill:#475467; }
      .file { font-size:11px; fill:#c4302b; font-weight:600; }
      .lane { font-size:12px; font-weight:700; fill:#98a2b3; letter-spacing:1px; }
      .edge { stroke:#5b6472; stroke-width:1.75; fill:none; marker-end:url(#arrow); }
      .edge-dashed { stroke:#98a2b3; stroke-width:1.5; fill:none; stroke-dasharray:5,4; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1180" height="760" fill="#fafafa"/>

  <text x="40" y="20" class="lane">YOUTUBE PAGE</text>
  <text x="40" y="230" class="lane">EXTENSION — CONTENT SCRIPT WORLD</text>
  <text x="40" y="560" class="lane">EXTENSION — UI &amp; BACKGROUND</text>

  <!-- YouTube page -->
  <rect x="40" y="34" width="300" height="80" class="box"/>
  <text x="60" y="62" class="title">youtube.com/watch</text>
  <text x="60" y="82" class="sub">&lt;video&gt; element + ytInitialPlayerResponse</text>
  <text x="60" y="100" class="file">manifest.json → content_scripts</text>

  <rect x="420" y="34" width="300" height="80" class="box"/>
  <text x="440" y="62" class="title">InnerTube API</text>
  <text x="440" y="82" class="sub">ANDROID client · returns caption track URLs</text>
  <text x="440" y="100" class="file">POST /youtubei/v1/player</text>

  <rect x="800" y="34" width="340" height="80" class="box"/>
  <text x="820" y="62" class="title">Caption track</text>
  <text x="820" y="82" class="sub">json3 (per-word timing) → XML fallback</text>
  <text x="820" y="100" class="file">&amp;fmt=json3</text>

  <!-- content script pipeline -->
  <rect x="40" y="250" width="260" height="90" class="box"/>
  <text x="58" y="278" class="title">content.js</text>
  <text x="58" y="298" class="sub">Orchestrates fetch → parse → match</text>
  <text x="58" y="316" class="sub">→ mute, SPA nav, toggle state</text>

  <rect x="340" y="250" width="260" height="90" class="box"/>
  <text x="358" y="278" class="title">lib/captions.js</text>
  <text x="358" y="298" class="sub">parseJson3 / parseCaptionXml</text>
  <text x="358" y="316" class="file">→ [{ word, startMs, endMs }]</text>

  <rect x="640" y="250" width="260" height="90" class="box"/>
  <text x="658" y="278" class="title">lib/matcher.js</text>
  <text x="658" y="298" class="sub">bad_words.json lookup + lead/trail</text>
  <text x="658" y="316" class="file">→ [{ startMs, endMs }] schedule</text>

  <rect x="940" y="250" width="200" height="90" class="box"/>
  <text x="958" y="278" class="title">lib/muter.js</text>
  <text x="958" y="298" class="sub">timeupdate + rAF loop</text>
  <text x="958" y="316" class="sub">video.volume = 0 / restore</text>

  <!-- UI + background lane -->
  <rect x="40" y="580" width="260" height="90" class="box"/>
  <text x="58" y="608" class="title">popup.html / popup.js</text>
  <text x="58" y="628" class="sub">On/off toggle + live status</text>
  <text x="58" y="646" class="file">chrome.tabs.sendMessage</text>

  <rect x="340" y="580" width="260" height="90" class="box"/>
  <text x="358" y="608" class="title">chrome.storage.local</text>
  <text x="358" y="628" class="sub">Persists enabled/disabled state</text>

  <rect x="640" y="580" width="260" height="90" class="box"/>
  <text x="658" y="608" class="title">background.js</text>
  <text x="658" y="628" class="sub">Service worker (Manifest V3)</text>

  <rect x="940" y="580" width="200" height="90" class="box" stroke-dasharray="4,3"/>
  <text x="958" y="608" class="title">#movie_player</text>
  <text x="958" y="628" class="sub">.ad-showing check</text>
  <text x="958" y="646" class="sub">suspends muting mid-ad</text>

  <!-- top row arrows -->
  <path d="M340,74 H420" class="edge"/>
  <path d="M720,74 H800" class="edge"/>

  <!-- top row down into pipeline -->
  <path d="M170,114 V250" class="edge"/>
  <path d="M970,114 V250" class="edge"/>

  <!-- pipeline arrows -->
  <path d="M300,295 H340" class="edge"/>
  <path d="M600,295 H640" class="edge"/>
  <path d="M900,295 H940" class="edge"/>

  <!-- muter back to video (mutes the page) -->
  <path d="M1040,340 V200 C1040,150 500,150 170,150 V250" class="edge-dashed"/>
  <text x="700" y="145" class="sub">video.volume set on &lt;video&gt; element</text>

  <!-- bottom lane connections -->
  <path d="M170,340 V580" class="edge"/>
  <path d="M300,625 H340" class="edge"/>
  <path d="M170,670 V705 H970 V670" class="edge-dashed"/>
  <text x="500" y="722" class="sub">popup queries live status via runtime messaging</text>
  <path d="M900,625 H940" class="edge-dashed"/>
</svg>
